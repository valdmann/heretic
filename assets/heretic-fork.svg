<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Heretic — personal experimental fork</title>
  <desc id="desc">A broken ring crossed by a bright diagonal stroke, beside the name Heretic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b20"/>
      <stop offset="1" stop-color="#202a2c"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ef775b"/>
      <stop offset="1" stop-color="#f1c17a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d6c9aa" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#dots)"/>
  <path d="M0 305H1200" stroke="#d6c9aa" stroke-opacity=".12"/>
  <path d="M64 54V306" stroke="#e98363" stroke-width="3"/>
  <text x="100" y="100" fill="#e8b879" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="4">A PERSONAL EXPERIMENTAL FORK</text>
  <text x="94" y="211" fill="#f2eee5" font-family="sans-serif" font-size="88" font-weight="700" letter-spacing="2">HERETIC</text>
  <text x="101" y="258" fill="#aeb8b2" font-family="sans-serif" font-size="17" letter-spacing="2">EXPERIMENTS LIVE HERE · UPSTREAM LINKED BELOW</text>
  <g transform="translate(930 178)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="112" stroke="#8f9a91" stroke-opacity=".18"/>
    <circle r="91" stroke="#d6c9aa" stroke-opacity=".48" stroke-width="1.5" stroke-dasharray="170 18 54 330" transform="rotate(-28)"/>
    <circle r="68" stroke="#d6c9aa" stroke-opacity=".25" stroke-width="1" stroke-dasharray="2 8"/>
    <path d="M-73 55 35-68" stroke="url(#stroke)" stroke-width="12"/>
    <path d="M-91 73 53-89" stroke="#f1c17a" stroke-opacity=".28" stroke-width="1"/>
    <path d="M-115 0h24M91 0h24M0-115v24M0 91v24" stroke="#d6c9aa" stroke-opacity=".5"/>
    <circle cx="-73" cy="55" r="5" fill="#ef775b" stroke="none"/>
    <circle cx="35" cy="-68" r="5" fill="#f1c17a" stroke="none"/>
  </g>
  <text x="1136" y="329" fill="#9aa69e" font-family="sans-serif" font-size="11" letter-spacing="2" text-anchor="end">HERETIC / FORK</text>
</svg>
